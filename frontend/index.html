<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cloud Eats - Food Ordering Web App</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://www.gstatic.com/firebasejs/10.1.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.1.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.1.0/firebase-firestore-compat.js"></script>
</head>
<body class="bg-gray-100 min-h-screen text-gray-800">

  <header class="bg-orange-600 text-white p-4 shadow-md sticky top-0 z-50">
    <div class="max-w-6xl mx-auto flex justify-between items-center">
      <h1 class="text-2xl font-bold">🍔 CloudEats</h1>
      <div id="auth-section">
        <button onclick="login()" class="bg-white text-orange-600 font-semibold px-4 py-2 rounded-lg shadow hover:bg-orange-50 transition">
          Login with Google
        </button>
      </div>
    </div>
  </header>

  <div class="max-w-6xl mx-auto p-4 grid grid-cols-1 md:grid-cols-3 gap-6 mt-4">
    <div class="md:col-span-2">
      <h2 class="text-xl font-bold mb-4">📜 Delicious Menu</h2>
      <div id="menu-container" class="grid grid-cols-1 sm:grid-cols-2 gap-4">
        <div class="p-4 bg-white rounded-lg shadow text-center text-gray-500">Loading Menu Items...</div>
      </div>
    </div>

    <div class="space-y-6">
      <div class="bg-white p-5 rounded-lg shadow">
        <h2 class="text-xl font-bold mb-3 border-b pb-2">🛒 Your Cart</h2>
        <div id="cart-items" class="space-y-2 text-sm text-gray-600 mb-4"><p class="italic">Cart is empty</p></div>
        <div class="flex justify-between font-bold text-lg mb-4"><span>Total:</span><span>₹<span id="cart-total">0</span></span></div>
        <button onclick="placeOrder()" class="w-full bg-orange-600 text-white py-2 rounded-lg font-bold hover:bg-orange-700 transition">Place Order</button>
      </div>

      <div class="bg-white p-5 rounded-lg shadow">
        <h2 class="text-xl font-bold mb-3 border-b pb-2">📍 Live Order Status</h2>
        <div id="live-orders" class="space-y-3"><p class="text-sm text-gray-500">Login to track your orders.</p></div>
      </div>
    </div>
  </div>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyBaUDKwqUYPe0GkJv7BsUI8KcLdOIKBcvk",
      authDomain: "food-ordering-app-943f7.firebaseapp.com",
      projectId: "food-ordering-app-943f7",
      storageBucket: "food-ordering-app-943f7.firebasestorage.app",
      messagingSenderId: "334188908872",
      appId: "1:334188908872:web:f02af2955264f7107d237d",
      measurementId: "G-XHBWZNXGDB"
    };

    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();
    const BACKEND_URL = "https://food-ordering-app-e7hm.onrender.com";

    let user = null;
    let cart = [];

    function login() {
      const provider = new firebase.auth.GoogleAuthProvider();
      auth.signInWithPopup(provider).then(res => {
        user = res.user;
        updateAuthUI();
        listenLiveOrders();
      }).catch(err => console.error("Login error:", err));
    }

    function logoutUser() {
      auth.signOut().then(() => {
        user = null;
        document.getElementById('auth-section').innerHTML = `
          <button onclick="login()" class="bg-white text-orange-600 font-semibold px-4 py-2 rounded-lg shadow hover:bg-orange-50 transition">
            Login with Google
          </button>
        `;
        document.getElementById('live-orders').innerHTML = '<p class="text-sm text-gray-500">Login to track your orders.</p>';
      }).catch(err => console.error("Logout error:", err));
    }

    function updateAuthUI() {
      if (user) {
        document.getElementById('auth-section').innerHTML = `
          <span class="font-medium mr-3 text-white">Hi, ${user.displayName.split(' ')[0]}</span>
          <button onclick="logoutUser()" class="bg-orange-800 text-xs text-white px-3 py-1 rounded hover:bg-orange-900 transition">Logout</button>
        `;
      }
    }

    db.collection('menu').onSnapshot(snapshot => {
      const container = document.getElementById('menu-container');
      container.innerHTML = '';
      snapshot.forEach(doc => {
        const item = doc.data();
        container.innerHTML += `
          <div class="bg-white p-4 rounded-lg shadow flex flex-col justify-between">
            <img src="${item.imageUrl || 'https://via.placeholder.com/150'}" class="h-36 w-full object-cover rounded mb-3">
            <h3 class="font-bold text-lg">${item.name}</h3>
            <p class="text-orange-600 font-bold mb-3">₹${item.price}</p>
            <button onclick="addToCart('${item.name}', ${item.price})" class="bg-gray-900 text-white py-1 rounded hover:bg-orange-600 transition">+ Add to Cart</button>
          </div>
        `;
      });
    });

    function addToCart(name, price) {
      cart.push({ name, price });
      renderCart();
    }

    function renderCart() {
      const container = document.getElementById('cart-items');
      let total = 0;
      container.innerHTML = '';
      if (cart.length === 0) {
        container.innerHTML = `<p class="italic">Cart is empty</p>`;
      } else {
        cart.forEach(item => {
          total += item.price;
          container.innerHTML += `<div class="flex justify-between"><span>${item.name}</span><span>₹${item.price}</span></div>`;
        });
      }
      document.getElementById('cart-total').innerText = total;
    }

    async function placeOrder() {
      if (!user) return alert("Pehle login karein!");
      if (cart.length === 0) return alert("Cart khali hai!");

      try {
        const res = await fetch(`${BACKEND_URL}/api/orders/create`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            userId: user.uid,
            items: cart,
            totalAmount: cart.reduce((sum, item) => sum + item.price, 0),
            deliveryAddress: "Jaipur, Rajasthan"
          })
        });

        const data = await res.json();
        if (data.success) {
          alert("Order Successful! ID: " + data.orderId);
          cart = [];
          renderCart();
        } else {
          alert("Order failed: " + (data.message || "Unknown error"));
        }
      } catch (err) {
        console.error("Order error:", err);
        alert("Server error while placing order.");
      }
    }

    function listenLiveOrders() {
      if (!user) return;
      db.collection('orders').where('userId', '==', user.uid).onSnapshot(snapshot => {
        const container = document.getElementById('live-orders');
        container.innerHTML = '';
        if (snapshot.empty) {
          container.innerHTML = `<p class="text-sm text-gray-500">No active orders found.</p>`;
          return;
        }
        snapshot.forEach(doc => {
          const order = doc.data();
          container.innerHTML += `
            <div class="p-3 bg-orange-50 rounded border border-orange-200">
              <div class="flex justify-between text-xs font-bold text-orange-800">
                <span>Status: ${order.status || 'Pending'}</span><span>₹${order.totalAmount}</span>
              </div>
            </div>
          `;
        });
      });
    }
  </script>
</body>
</html>
